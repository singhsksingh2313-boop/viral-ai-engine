name: Project Master Editor - Autonomous Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Optional: Direct MP4 Video URL (leave blank to use source_input.mp4 or real HD documentary footage)"
        required: false
        default: ""
      hindi_script:
        description: "Optional: Custom Hindi Narration Script (leave blank to use script_hi.txt)"
        required: false
        default: ""
  push:
    branches:
      - main

permissions:
  contents: write
  actions: write

jobs:
  build-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install System FFmpeg & Devanagari Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1 fonts-noto-core fonts-lohit-deva

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Master Editor V2.1 (Gemini 2.5 Pro Director + Human TTS + Word Sync)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          INPUT_VIDEO_URL: ${{ github.event.inputs.video_url }}
          INPUT_HINDI_SCRIPT: ${{ github.event.inputs.hindi_script }}
        run: |
          python engine.py

      - name: Upload Final Documentary Package & Independent QC Report
        uses: actions/upload-artifact@v4
        with:
          name: master-editor-production-package
          retention-days: 5
          path: |
            final_video.mp4
            thumbnail.jpg
            metadata.json
            output/final_video.mp4
            output/narration.wav
            output/subtitles.srt
            output/qc_report.json
            output/qc_report.md
            output/manifest.json
