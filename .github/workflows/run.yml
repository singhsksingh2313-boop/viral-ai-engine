name: Run Viral AI Engine

on:
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & Fonts)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation

    - name: Install Python Libraries
      run: |
        pip install -r requirements.txt

    - name: Run 7-Brain AI Engine
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      run: |
        python engine.py

    - name: Upload Final Video for Download
      uses: actions/upload-artifact@v4
      with:
        name: Viral-Video-Assets
        path: |
          final_video.mp4
          thumbnail.jpg
          metadata.json
